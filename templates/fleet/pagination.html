{% if page.paginator.num_pages > 1 %}<div class="pagination">{% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">← Zurück</a>{% endif %}<span>Seite {{ page.number }} von {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Weiter →</a>{% endif %}</div>{% endif %}
